<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Add New Pasta</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Add New Pasta</ion-title>
    </ion-toolbar>
  </ion-header>
    <ion-list>
      <ion-item>
        <ion-input label="Name" labelPlacement = "floating" placeholder="Enter pasta name" [(ngModel)]="new_name"></ion-input>
      </ion-item>
      <ion-item>
        <ion-textarea label="Description" labelPlacement = "floating" rows = "4" placeholder="Enter description" [(ngModel)]="new_desc"></ion-textarea>
      </ion-item>
      <ion-item>
        <ion-input label="Image" placeholder="Enter URL" type = "url" [(ngModel)]="new_url"></ion-input>
      </ion-item>
      <ion-item>
        <ion-img [src] = "new_url"></ion-img>
      </ion-item>
      <ion-item>
        <ion-select [(ngModel)]="new_price" label="Price" labelPlacement="floating" >
          <ion-select-option *ngFor="let price of arr_price"     
                  [value]="price">{{price}}</ion-select-option>
        </ion-select>
      </ion-item>
      
      <ion-button expand = "full" id="btnsubmit" (click)="submitpasta()">Submit</ion-button>
            <ion-alert
              trigger="btnsubmit"
              header="Add Pasta"
              message="Data berhasil ditambahkan!"
              [buttons]="alertButtons"
            ></ion-alert>
    </ion-list>
</ion-content>
